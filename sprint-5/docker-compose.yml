
services:
  localstack:
    image: localstack/localstack:4.14
    container_name: sprint5-localstack
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3,dynamodb
      AWS_DEFAULT_REGION: us-east-1
      PERSISTENCE: "1"
    volumes:
      - localstack_data:/var/lib/localstack
    restart: unless-stopped

volumes:
  localstack_data:

