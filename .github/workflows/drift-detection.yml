
name: Terraform Drift Detection

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

jobs:
  drift-detection:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Initialize Terraform
        working-directory: sprint-9/terraform
        run: terraform init

      - name: Validate Terraform
        working-directory: sprint-9/terraform
        run: terraform validate

      - name: Create test infrastructure
        working-directory: sprint-9/terraform
        run: terraform apply -auto-approve

      - name: Verify initial restart policy
        run: |
          echo "Restart policy before manual change:"
          docker inspect -f '{{.HostConfig.RestartPolicy.Name}}' sprint-9-drift-test

      - name: Simulate manual change
        run: |
          docker update --restart always sprint-9-drift-test
          echo "Restart policy after manual change:"
          docker inspect -f '{{.HostConfig.RestartPolicy.Name}}' sprint-9-drift-test

      - name: Verify manual change
        run: |
          POLICY=$(docker inspect -f '{{.HostConfig.RestartPolicy.Name}}' sprint-9-drift-test)
          echo "Actual restart policy: $POLICY"
          test "$POLICY" = "always"

      - name: Detect drift and send alert
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: |
          chmod +x sprint-9/scripts/detect-drift.sh
          sprint-9/scripts/detect-drift.sh

      - name: Verify drift was detected
        run: |
          grep -F 'restart' sprint-9/proof/drift-report.txt
          grep -F '"always" -> "no"' sprint-9/proof/drift-report.txt

      - name: Upload proof files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sprint-9-proof
          path: |
            sprint-9/proof/drift-report.txt
            sprint-9/proof/webhook-response.txt
          if-no-files-found: ignore

