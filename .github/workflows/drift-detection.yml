
name: Terraform Drift Detection

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

jobs:
  drift-detection:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Initialize Terraform
        working-directory: sprint-9/terraform
        run: terraform init

      - name: Validate Terraform
        working-directory: sprint-9/terraform
        run: terraform validate

      - name: Create test infrastructure
        working-directory: sprint-9/terraform
        run: terraform apply -auto-approve

      - name: Clear old proof files
        run: |
          rm -f sprint-9/proof/drift-report.txt
          rm -f sprint-9/proof/webhook-response.txt

      - name: Simulate manual change
        run: |
          docker update --restart always sprint-9-drift-test
          test "$(docker inspect -f '{{.HostConfig.RestartPolicy.Name}}' sprint-9-drift-test)" = "always"

      - name: Detect drift and send alert
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: |
          chmod +x sprint-9/scripts/detect-drift.sh
          sprint-9/scripts/detect-drift.sh

      - name: Verify drift was detected in this run
        run: |
          test -f sprint-9/proof/drift-report.txt
          grep -F '"always" -> "no"' sprint-9/proof/drift-report.txt

      - name: Upload proof files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sprint-9-proof
          path: |
            sprint-9/proof/drift-report.txt
            sprint-9/proof/webhook-response.txt
          if-no-files-found: ignore

